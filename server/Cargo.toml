[package]
name = "mine-together-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }

# The water simulation is too slow in an unoptimised build, even while developing.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
